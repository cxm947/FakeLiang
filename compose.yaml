name: agv-planner
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: agv
      POSTGRES_USER: agv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.database}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - planner_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agv -d agv"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  planner_postgres:
